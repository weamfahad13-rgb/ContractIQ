[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractiq"
version = "0.1.0"
description = "Bilingual RAG assistant for supplier contracts and procurement data"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractiq = ["*.sql"]
